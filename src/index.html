  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'" />

<body>
  <app-root>
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;height:100dvh;background:#f8f6f3;font-family:system-ui,-apple-system,sans-serif">
      <img src="/branding/tusuper-logo-new.png" alt="TuSuper" style="width:80px;height:80px;animation:pulse 2s ease-in-out infinite" />
      <p style="margin-top:16px;color:#6b7280;font-size:14px;letter-spacing:0.05em">Cargando TuSuper...</p>
    </div>
    <style>
      @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.6;transform:scale(0.95)} }
    </style>
  </app-root>
  <script>
    // iOS Safari ignores user-scalable=no. Prevent pinch-to-zoom via JS.
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
    document.addEventListener('gestureend', function (e) { e.preventDefault(); });
  </script>
</body>

</html>
