<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #drawer
    class="sidenav"
    fixedInViewport
    [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
    [mode]="(isHandset$ | async) ? 'over' : 'side'"
    [opened]="(isHandset$ | async) === false"
  >
    <mat-toolbar>Menu</mat-toolbar>
    @if (authService.isAuthenticated()) {
      <mat-nav-list>
        @for (moduleName of menuItems(); track moduleName) {
          <a mat-list-item 
            [routerLink]="'/' + moduleName.toLowerCase()" 
            routerLinkActive="active-link">
            <span matListItemTitle>{{ moduleName }}</span>
          </a>
        }
        <a mat-list-item (click)="logout()">
          <span matListItemTitle>Cerrar sesion</span>
        </a>
      </mat-nav-list>
    }
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar color="primary">
      @if (isHandset$ | async) {
        <button type="button" aria-label="Toggle sidenav" matIconButton (click)="drawer.toggle()">
          <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
        </button>
      }
      <span>Hola, {{ currentUser()?.firstName }}</span>
    </mat-toolbar>
    <!-- Add Content Here -->
     <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
