<div class="loading-screen-overlay">
  <div class="loading-screen-content">
    <!-- Minimalist Shopping Cart -->
    <div class="cart-wrapper">
      <svg class="cart-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path class="cart-body" d="M4 4H10L14 20H54L58 10H20" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path class="cart-body" d="M14 20L18 40H50L54 20H14Z" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle class="cart-wheel" cx="22" cy="46" r="4" stroke="currentColor" stroke-width="3"/>
        <circle class="cart-wheel" cx="46" cy="46" r="4" stroke="currentColor" stroke-width="3"/>
        <circle class="cart-item item-1" cx="24" cy="16" r="3" fill="currentColor"/>
        <circle class="cart-item item-2" cx="32" cy="12" r="2.5" fill="currentColor"/>
        <circle class="cart-item item-3" cx="40" cy="16" r="3" fill="currentColor"/>
        <rect class="cart-item item-4" x="28" y="14" width="4" height="4" rx="1" fill="currentColor"/>
      </svg>
    </div>

    <!-- Text -->
    <div class="loading-text">
      <h2 class="loading-title">{{ message }}</h2>
      <p class="loading-subtitle">{{ submessage }}</p>
    </div>

    <!-- Progress bar -->
    <div class="loading-progress">
      <div class="loading-progress-bar"></div>
    </div>
  </div>
</div>
