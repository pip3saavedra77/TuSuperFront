<button mat-icon-button [matMenuTriggerFor]="notificationMenu" [matBadge]="unreadCount()" 
        [matBadgeHidden]="unreadCount() === 0" matBadgeColor="warn" class="notification-trigger">
  <mat-icon>notifications</mat-icon>
</button>

<mat-menu #notificationMenu="matMenu" xPosition="before" class="notification-panel-menu">
  <div class="notification-header" (click)="$event.stopPropagation()">
    <span class="header-title">Notificaciones</span>
    <div class="header-actions">
      <button mat-button color="primary" (click)="markAllAsRead()" *ngIf="unreadCount() > 0">
        Marcar todo como leído
      </button>
      <button mat-icon-button (click)="clearAll()" title="Limpiar todo">
        <mat-icon>delete_sweep</mat-icon>
      </button>
    </div>
  </div>

  <mat-divider></mat-divider>

  <div class="notification-list-container" (click)="$event.stopPropagation()">
    <div *ngIf="notifications().length === 0" class="empty-state">
      <mat-icon>notifications_none</mat-icon>
      <p>No tienes notificaciones</p>
    </div>

    <div *ngFor="let notification of notifications()" 
         class="notification-item" 
         [class.unread]="!notification.isRead"
         (click)="markAsRead($event, notification.id)">
      
      <div class="unread-indicator" *ngIf="!notification.isRead"></div>
      
      <div class="notification-icon">
        <mat-icon [color]="notification.type === 'new-order' ? 'accent' : 'primary'">
          {{ notification.type === 'new-order' ? 'shopping_bag' : 'info' }}
        </mat-icon>
      </div>

      <div class="notification-content">
        <div class="content-header">
          <span class="title">{{ notification.title }}</span>
          <span class="time">{{ getTimeAgo(notification.timestamp) }}</span>
        </div>
        <p class="message">{{ notification.message }}</p>
      </div>
    </div>
  </div>
</mat-menu>
