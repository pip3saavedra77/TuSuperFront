<div class="mat-elevation-z8">

  <cdk-virtual-scroll-viewport [style.height]="viewportHeight" itemSize="48" class="custom-table-viewport">

    <table mat-table [dataSource]="dataSource" matSort>



      @for (column of columns; track column.key) {

        <ng-container [matColumnDef]="column.key">

          <th mat-header-cell *matHeaderCellDef mat-sort-header> {{ column.label }} </th>

          <td mat-cell *matCellDef="let element"> {{ element[column.key] }} </td>

        </ng-container>

      }



      <ng-container matColumnDef="actions">

        <th mat-header-cell *matHeaderCellDef> Acciones </th>

        <td mat-cell *matCellDef="let element">

          <div class="action-buttons">

            <button mat-icon-button color="primary" (click)="onEdit(element)" title="Editar">

               <span class="material-icons">edit</span>

            </button>

            

            <button mat-icon-button color="warn" (click)="onDelete(element)" title="Eliminar">

               <span class="material-icons">delete</span>

            </button>

          </div>

        </td>

      </ng-container>



      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>

      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>

  </cdk-virtual-scroll-viewport>



  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>

</div>
