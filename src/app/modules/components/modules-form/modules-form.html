<form [formGroup]="form" (ngSubmit)="onSave()" class="form-dialog">

  <header class="form-dialog__header">
    <div class="form-dialog__icon">
      <mat-icon>view_module</mat-icon>
    </div>
    <div class="form-dialog__heading">
      <h2 class="form-dialog__title">{{ isEditMode ? 'Editar Módulo' : 'Nuevo Módulo' }}</h2>
      <p class="form-dialog__subtitle">
        {{ isEditMode ? 'Actualiza los datos de este módulo.' : 'Define un nuevo módulo funcional de la plataforma.' }}
      </p>
    </div>
    <button mat-icon-button type="button" class="form-dialog__close" (click)="onCancel()" aria-label="Cerrar">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <mat-dialog-content class="form-dialog__body">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="name" placeholder="Ej: auth">
      <mat-icon matSuffix>label</mat-icon>
      <mat-error *ngIf="form.get('name')?.hasError('required')">El nombre es obligatorio</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Descripción</mat-label>
      <textarea matInput formControlName="description" rows="3" placeholder="Descripción del módulo"></textarea>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions class="form-dialog__actions">
    <button mat-button type="button" class="form-dialog__btn-cancel" (click)="onCancel()">Cancelar</button>
    <button mat-flat-button type="submit" class="form-dialog__btn-submit" [disabled]="form.invalid">
      {{ isEditMode ? 'Actualizar' : 'Crear módulo' }}
    </button>
  </mat-dialog-actions>

</form>
