<div class="header">
    <h1>Gestión de Módulos</h1>
    <button mat-raised-button color="primary" (click)="openDialog()">
        Nuevo Módulo
    </button>

    <app-custom-table [data]="store.modules()" [columns]="columns" (edit)="handleEdit($event)"
        (delete)="handleDelete($event)">
    </app-custom-table>
</div>
