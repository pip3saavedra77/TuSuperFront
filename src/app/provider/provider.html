<div class="provider-container">
    <!-- HEADER -->
    <div class="page-header">
      <h2 class="page-title">Gestión de Proveedores</h2>
      <button mat-flat-button class="add-btn" (click)="onAdd()">
        <mat-icon>add</mat-icon>
        Nuevo Proveedor
      </button>
    </div>
  
    <!-- BÚSQUEDA -->
    <div class="search-panel">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Buscar por nombre</mat-label>
        <input
          matInput
          [value]="searchTerm"
          (input)="onSearchInput($event)"
          placeholder="Escribe para buscar..." />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>
  
    <!-- LOADING -->
    @if (loading()) {
      <div class="loading-container">
        <mat-spinner diameter="48"></mat-spinner>
      </div>
    } @else {
      <!-- TABLA -->
      <div class="table-container">
        <table mat-table [dataSource]="providers()" class="providers-table">
  
          <!-- ID -->
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>ID</th>
            <td mat-cell *matCellDef="let provider">{{ provider.id }}</td>
          </ng-container>
  
          <!-- Nombre -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Nombre</th>
            <td mat-cell *matCellDef="let provider">{{ provider.name }}</td>
          </ng-container>
  
          <!-- Teléfono -->
          <ng-container matColumnDef="phone">
            <th mat-header-cell *matHeaderCellDef>Teléfono</th>
            <td mat-cell *matCellDef="let provider">
              {{ provider.phone || 'N/A' }}
            </td>
          </ng-container>

          <!-- Email -->
          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>Email</th>
            <td mat-cell *matCellDef="let provider">
              {{ provider.email || 'N/A' }}
            </td>
          </ng-container>
  
          <!-- Acciones -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Acciones</th>
            <td mat-cell *matCellDef="let provider">
              @let hasProducts = (provider._count?.products || 0) > 0;
              <div class="action-buttons">
                <button mat-icon-button class="edit-btn"
                        (click)="onEdit(provider)" title="Editar">
                  <mat-icon>edit</mat-icon>
                </button>
                
                <span [matTooltip]="hasProducts ? 'Tiene productos asociados' : ''">
                    <button mat-icon-button class="delete-btn"
                            [disabled]="hasProducts"
                            (click)="onDelete(provider)" title="Eliminar">
                      <mat-icon>delete</mat-icon>
                    </button>
                </span>
              </div>
            </td>
          </ng-container>
  
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  
          <!-- Empty state -->
          <tr class="mat-row no-data-row" *matNoDataRow>
            <td class="mat-cell no-data-cell" [attr.colspan]="displayedColumns.length">
              No se encontraron proveedores
            </td>
          </tr>
        </table>
  
        <mat-paginator
          [length]="totalProviders()"
          [pageSize]="currentLimit()"
          [pageSizeOptions]="[5, 10, 20]"
          [pageIndex]="currentOffset() / currentLimit()"
          (page)="onPageChange($event)"
          showFirstLastButtons>
        </mat-paginator>
      </div>
    }
  </div>
