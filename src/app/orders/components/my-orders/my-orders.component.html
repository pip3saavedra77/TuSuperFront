<div class="orders-container">
  <div class="glass-card orders-card">
    <header class="orders-header">
      <h1>Mis Pedidos</h1>
      <button mat-icon-button (click)="loadOrders()" [disabled]="loading()">
        <mat-icon [class.spin]="loading()">refresh</mat-icon>
      </button>
    </header>

    <div class="table-wrapper">
      <table mat-table [dataSource]="orders()" class="orders-table">
        
        <!-- ID Column -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>ID Pedido</th>
          <td mat-cell *matCellDef="let order">#{{ order.id }}</td>
        </ng-container>

        <!-- Date Column -->
        <ng-container matColumnDef="createdAt">
          <th mat-header-cell *matHeaderCellDef>Fecha</th>
          <td mat-cell *matCellDef="let order">{{ order.createdAt | date:'short' }}</td>
        </ng-container>

        <!-- Total Column -->
        <ng-container matColumnDef="totalAmount">
          <th mat-header-cell *matHeaderCellDef>Total</th>
          <td mat-cell *matCellDef="let order">{{ order.totalAmount | currency }}</td>
        </ng-container>

        <!-- Status Column -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let order">
            <span class="status-badge" [attr.data-status]="order.status">
              {{ getStatusLabel(order.status) }}
            </span>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <div *ngIf="orders().length === 0 && !loading()" class="empty-state">
        <mat-icon>receipt_long</mat-icon>
        <p>Aún no has realizado ningún pedido.</p>
      </div>

      <mat-progress-spinner *ngIf="loading()" mode="indeterminate" diameter="40" class="spinner"></mat-progress-spinner>
    </div>

    <mat-paginator
      [length]="totalOrders()"
      [pageSize]="currentLimit()"
      [pageSizeOptions]="[5, 10, 25]"
      (page)="onPageChange($event)"
      aria-label="Seleccionar página"
    ></mat-paginator>
  </div>
</div>
