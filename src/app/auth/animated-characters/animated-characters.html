<div class="characters-container">
  <!-- Green tall rectangle character - Back layer -->
  <div
    #greenRef
    class="character green-character"
    [class.blinking]="isGreenBlinking()"
    [style.width.px]="180"
    [style.height.px]="(isTyping || passwordHidden) ? 440 : 400"
    [style.left.px]="70"
    [style.z-index]="1"
    [style.transform]="passwordVisible
      ? 'skewX(0deg)'
      : (isTyping || passwordHidden)
        ? 'skewX(' + ((calculatePosition(greenRef).bodySkew || 0) - 12) + 'deg) translateX(40px)'
        : 'skewX(' + (calculatePosition(greenRef).bodySkew || 0) + 'deg)'"
  >
    <!-- Eyes -->
    <div
      class="eyes-container"
      [style.left.px]="passwordVisible ? 20 : (isLookingAtEachOther() ? 55 : 45 + (calculatePosition(greenRef).faceX || 0))"
      [style.top.px]="passwordVisible ? 35 : (isLookingAtEachOther() ? 65 : 40 + (calculatePosition(greenRef).faceY || 0))"
    >
      <div
        class="eyeball"
        [class.blinking]="isGreenBlinking()"
        [style.width.px]="18"
        [style.height.px]="isGreenBlinking() ? 2 : 18"
      >
        @if (!isGreenBlinking()) {
          <div
            class="pupil"
            [style.width.px]="7"
            [style.height.px]="7"
            [style.transform]="'translate(' +
              (getForcedLook(passwordVisible ? (isGreenPeeking() ? 'peeking' : 'away') : (isLookingAtEachOther() ? 'eachOther' : undefined))?.x ?? calculateEyePosition(greenRef, 5).x) +
              'px, ' +
              (getForcedLook(passwordVisible ? (isGreenPeeking() ? 'peeking' : 'away') : (isLookingAtEachOther() ? 'eachOther' : undefined))?.y ?? calculateEyePosition(greenRef, 5).y) +
              'px)'"
          ></div>
        }
      </div>
      <div
        class="eyeball"
        [class.blinking]="isGreenBlinking()"
        [style.width.px]="18"
        [style.height.px]="isGreenBlinking() ? 2 : 18"
      >
        @if (!isGreenBlinking()) {
          <div
            class="pupil"
            [style.width.px]="7"
            [style.height.px]="7"
            [style.transform]="'translate(' +
              (getForcedLook(passwordVisible ? (isGreenPeeking() ? 'peeking' : 'away') : (isLookingAtEachOther() ? 'eachOther' : undefined))?.x ?? calculateEyePosition(greenRef, 5).x) +
              'px, ' +
              (getForcedLook(passwordVisible ? (isGreenPeeking() ? 'peeking' : 'away') : (isLookingAtEachOther() ? 'eachOther' : undefined))?.y ?? calculateEyePosition(greenRef, 5).y) +
              'px)'"
          ></div>
        }
      </div>
    </div>
  </div>

  <!-- Dark green tall rectangle character - Middle layer -->
  <div
    #darkGreenRef
    class="character dark-green-character"
    [class.blinking]="isDarkGreenBlinking()"
    [style.width.px]="120"
    [style.height.px]="310"
    [style.left.px]="240"
    [style.z-index]="2"
    [style.transform]="passwordVisible
      ? 'skewX(0deg)'
      : isLookingAtEachOther()
        ? 'skewX(' + ((calculatePosition(darkGreenRef).bodySkew || 0) * 1.5 + 10) + 'deg) translateX(20px)'
        : (isTyping || passwordHidden)
          ? 'skewX(' + ((calculatePosition(darkGreenRef).bodySkew || 0) * 1.5) + 'deg)'
          : 'skewX(' + (calculatePosition(darkGreenRef).bodySkew || 0) + 'deg)'"
  >
    <!-- Eyes -->
    <div
      class="eyes-container"
      [style.left.px]="passwordVisible ? 10 : (isLookingAtEachOther() ? 32 : 26 + (calculatePosition(darkGreenRef).faceX || 0))"
      [style.top.px]="passwordVisible ? 28 : (isLookingAtEachOther() ? 12 : 32 + (calculatePosition(darkGreenRef).faceY || 0))"
    >
      <div
        class="eyeball"
        [class.blinking]="isDarkGreenBlinking()"
        [style.width.px]="16"
        [style.height.px]="isDarkGreenBlinking() ? 2 : 16"
      >
        @if (!isDarkGreenBlinking()) {
          <div
            class="pupil"
            [style.width.px]="6"
            [style.height.px]="6"
            [style.transform]="'translate(' +
              (getForcedLook(passwordVisible ? 'away' : (isLookingAtEachOther() ? 'away' : undefined))?.x ?? calculateEyePosition(darkGreenRef, 4).x) +
              'px, ' +
              (getForcedLook(passwordVisible ? 'away' : (isLookingAtEachOther() ? 'away' : undefined))?.y ?? calculateEyePosition(darkGreenRef, 4).y) +
              'px)'"
          ></div>
        }
      </div>
      <div
        class="eyeball"
        [class.blinking]="isDarkGreenBlinking()"
        [style.width.px]="16"
        [style.height.px]="isDarkGreenBlinking() ? 2 : 16"
      >
        @if (!isDarkGreenBlinking()) {
          <div
            class="pupil"
            [style.width.px]="6"
            [style.height.px]="6"
            [style.transform]="'translate(' +
              (getForcedLook(passwordVisible ? 'away' : (isLookingAtEachOther() ? 'away' : undefined))?.x ?? calculateEyePosition(darkGreenRef, 4).x) +
              'px, ' +
              (getForcedLook(passwordVisible ? 'away' : (isLookingAtEachOther() ? 'away' : undefined))?.y ?? calculateEyePosition(darkGreenRef, 4).y) +
              'px)'"
          ></div>
        }
      </div>
    </div>
  </div>

  <!-- Light green semi-circle character - Front left -->
  <div
    #lightGreenRef
    class="character light-green-character"
    [style.width.px]="240"
    [style.height.px]="200"
    [style.left.px]="0"
    [style.z-index]="3"
    [style.transform]="passwordVisible ? 'skewX(0deg)' : 'skewX(' + (calculatePosition(lightGreenRef).bodySkew || 0) + 'deg)'"
  >
    <!-- Pupils only (no white eyeball) -->
    <div
      class="eyes-container pupils-only"
      [style.left.px]="passwordVisible ? 50 : 82 + (calculatePosition(lightGreenRef).faceX || 0)"
      [style.top.px]="passwordVisible ? 85 : 90 + (calculatePosition(lightGreenRef).faceY || 0)"
    >
      <div
        class="pupil"
        [style.width.px]="12"
        [style.height.px]="12"
        [style.transform]="'translate(' +
          (getForcedLook(passwordVisible ? 'away' : undefined)?.x ?? calculateEyePosition(lightGreenRef, 5).x) +
          'px, ' +
          (getForcedLook(passwordVisible ? 'away' : undefined)?.y ?? calculateEyePosition(lightGreenRef, 5).y) +
          'px)'"
      ></div>
      <div
        class="pupil"
        [style.width.px]="12"
        [style.height.px]="12"
        [style.transform]="'translate(' +
          (getForcedLook(passwordVisible ? 'away' : undefined)?.x ?? calculateEyePosition(lightGreenRef, 5).x) +
          'px, ' +
          (getForcedLook(passwordVisible ? 'away' : undefined)?.y ?? calculateEyePosition(lightGreenRef, 5).y) +
          'px)'"
      ></div>
    </div>
  </div>

  <!-- Lime tall rounded character - Front right -->
  <div
    #limeRef
    class="character lime-character"
    [style.width.px]="140"
    [style.height.px]="230"
    [style.left.px]="310"
    [style.z-index]="4"
    [style.transform]="passwordVisible ? 'skewX(0deg)' : 'skewX(' + (calculatePosition(limeRef).bodySkew || 0) + 'deg)'"
  >
    <!-- Pupils only -->
    <div
      class="eyes-container pupils-only"
      [style.left.px]="passwordVisible ? 20 : 52 + (calculatePosition(limeRef).faceX || 0)"
      [style.top.px]="passwordVisible ? 35 : 40 + (calculatePosition(limeRef).faceY || 0)"
    >
      <div
        class="pupil"
        [style.width.px]="12"
        [style.height.px]="12"
        [style.transform]="'translate(' +
          (getForcedLook(passwordVisible ? 'away' : undefined)?.x ?? calculateEyePosition(limeRef, 5).x) +
          'px, ' +
          (getForcedLook(passwordVisible ? 'away' : undefined)?.y ?? calculateEyePosition(limeRef, 5).y) +
          'px)'"
      ></div>
      <div
        class="pupil"
        [style.width.px]="12"
        [style.height.px]="12"
        [style.transform]="'translate(' +
          (getForcedLook(passwordVisible ? 'away' : undefined)?.x ?? calculateEyePosition(limeRef, 5).x) +
          'px, ' +
          (getForcedLook(passwordVisible ? 'away' : undefined)?.y ?? calculateEyePosition(limeRef, 5).y) +
          'px)'"
      ></div>
    </div>
    <!-- Mouth line -->
    <div
      class="mouth-line"
      [style.left.px]="passwordVisible ? 10 : 40 + (calculatePosition(limeRef).faceX || 0)"
      [style.top.px]="passwordVisible ? 88 : 88 + (calculatePosition(limeRef).faceY || 0)"
    ></div>
  </div>
</div>
