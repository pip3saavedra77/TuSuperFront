# Blueprint de Render para el frontend (Static Site)
# Documentacion: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: tusuper-frontend
    runtime: static
    buildCommand: npm ci && npm run build:render
    staticPublishPath: dist/adso_3063267
    envVars:
      - key: API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
      - type: rewrite
        source: /index.html
        destination: /index.html
